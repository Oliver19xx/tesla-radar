name: Tesla Radar Scraper & Monitor

on:
  schedule:
    # Läuft tagsüber alle 2 Stunden nach deutscher Zeit (07:00, 09:00, 11:00, 13:00, 15:00, 17:00, 19:00, 21:00 Uhr)
    - cron: '0 5,7,9,11,13,15,17,19 * * *'
  workflow_dispatch: # Ermöglicht manuelles Starten mit 1 Klick vom Smartphone aus!
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scrape_and_deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: macos-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhängigkeiten & Playwright WebKit installieren
        run: |
          pip install -r requirements.txt
          playwright install webkit

      - name: Tesla Bestand abfragen & Telegram Alert senden
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scrape_tesla.py

      - name: Historie und Report im Repository aktualisieren
        run: |
          git config --global user.name "Tesla Radar Bot"
          git config --global user.email "bot@tesla-radar.local"
          git add tesla_history.json angebote_aktuell.json index.html tesla_angebote.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-Update Tesla Radar [skip ci]" && git push)

      - name: GitHub Pages Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
